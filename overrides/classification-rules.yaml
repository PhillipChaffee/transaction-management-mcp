# Exclusive write-tier predicates (applied after GET→read).
binaryIoOperationIds:
  - Documents_AddDocumentToSale
  - Documents_AddDocumentToListing

adminTags:
  - Offices

adminOperationIds:
  - Checklists_CopyChecklists

# Non-GET ops on these tags are financial (before destructive).
financialTags:
  - Sale Commissions
  - Sale Tiered Commissions
  - Sale Commission Referral
  - Sale Commission Breakdowns
  - Sale Commission Splits
  - Sale Additional Commissions Information Log
  - Earnest money deposit
  - Listing Commissions
  - Listing Tiered Commissions
  - Listing Commission Referral
  - Sale CDA document data
  - V2 Sale Commissions
  - V2 Sale Tiered Commissions
  - V2 Listing Commissions
  - V2 Listing Tiered Commissions

destructiveOperationIdSubstrings:
  - Close
  - Convert
  - Reject
  - UnReject
  - Unassign

# Capability predicates (independent / conjunctive with tier capabilities).
binaryIoCapabilityOperationIds:
  - Documents_AddDocumentToSale
  - Documents_AddDocumentToListing
  - CdaDocumentData_GetCdaDocumentData
  - CdaDocumentData_SetCdaDocumentData
  # Sales_GetSales returns form/binary fields and requires impersonation.
  - Sales_GetSales

binaryIoCapabilityOperationIdPrefixes:
  - CdaDocumentData_

impersonationParameterName: userBeingImpersonated

bulkExportTag: Bulk Export
